name: .NET DLL Build & Release

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: ProofAcidFireCold
  SOLUTION_FILE: ProofAcidFireCold.sln
  PROJECT_PATH: ProofAcidFireCold.csproj
  DOTNET_VERSION: "10.0.x"
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4

      - name: Get version from package.xml
        id: version
        run: |
          echo "version=$(grep -o '<version>[^<]*' package.xml | sed 's/<version>//')" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@131b410979e0b49e2162c0718030257b22d6dc2c # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Publish Artifact
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --output ./publish --no-build

      - name: Upload build artifacts
        uses: actions/upload-artifact@47309c993abb98030a35d55ef7ff34b7fa1074b5 # v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ steps.version.outputs.version }}
          path: ./publish/

  release:
    needs: build-and-pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4

      - name: Download Artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v4
        id: download
        with:
          name: ${{ env.PROJECT_NAME }}-${{ needs.build-and-pack.outputs.version }}
          path: "${{ env.PROJECT_NAME }}-${{ needs.build-and-pack.outputs.version }}"

      - name: zip Artifact and SHA256 hash
        id: ziphash
        run: |
          zip -r "${{ env.PROJECT_NAME }}-${{ needs.build-and-pack.outputs.version }}.zip" "${{ env.PROJECT_NAME }}-${{ needs.build-and-pack.outputs.version }}"
          echo "sha256=$(sha256sum ${{ env.PROJECT_NAME }}-${{ needs.build-and-pack.outputs.version }}.zip | awk '{ print $1 }')" >> $GITHUB_OUTPUT

      - name: Upload release
        uses: softprops/action-gh-release@e798e6a1ede8d07b74ac4cdac6bdfa4cc1653907 # v2
        with:
          files: |
            ${{ env.PROJECT_NAME }}-${{ needs.build-and-pack.outputs.version }}.zip
          tag_name: ${{ needs.build-and-pack.outputs.version }}
          name: ${{ needs.build-and-pack.outputs.version }}
          body: |
            ## sha256
            - ${{ env.PROJECT_NAME }}-${{ needs.build-and-pack.outputs.version }}.zip: ${{ steps.ziphash.outputs.sha256 }}
          draft: true
          prerelease: true
