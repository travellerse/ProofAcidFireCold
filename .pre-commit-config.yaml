repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, markdown, json, xml]

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        entry: dotnet format ./ProofAcidFireCold.sln --include
        language: system
        files: \.(cs|csproj|sln)$
        pass_filenames: true
